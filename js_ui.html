<script>
  function renderAll() {
    renderStats();
    renderParticipantList();
    renderBusSeats();
    renderInfoTab();
  }

  function renderStats() {
    var stats = appState.stats || {};
    var totalWargaEl = document.getElementById('stat-total-warga');
    var busTotalEl = document.getElementById('stat-kursi-bus-total');
    var busDetailEl = document.getElementById('stat-kursi-bus-detail');
    var tabunganEl = document.getElementById('stat-total-tabungan');
    var sumbanganEl = document.getElementById('stat-total-sumbangan');

    var bus1Count = stats.kursiTerisiBus1 || 0;
    var bus2Count = stats.kursiTerisiBus2 || 0;
    var totalBusCount = bus1Count + bus2Count;

    if (totalWargaEl) totalWargaEl.textContent = stats.totalWarga || 0;
    if (busTotalEl) busTotalEl.textContent = totalBusCount + ' / 66';
    if (busDetailEl) busDetailEl.textContent = 'B1: ' + bus1Count + '/33 • B2: ' + bus2Count + '/33';
    if (tabunganEl) tabunganEl.textContent = 'Rp ' + (stats.totalTabungan || 0).toLocaleString('id-ID');
    if (sumbanganEl) sumbanganEl.textContent = 'Rp ' + (stats.totalSumbangan || 0).toLocaleString('id-ID');

    var b1Badge = document.getElementById('badge-bus1-count');
    var b2Badge = document.getElementById('badge-bus2-count');
    if (b1Badge) b1Badge.textContent = '(' + bus1Count + '/33)';
    if (b2Badge) b2Badge.textContent = '(' + bus2Count + '/33)';
  }

  function handleSearchInput() {
    var input = document.getElementById('search-input');
    var clearBtn = document.getElementById('btn-clear-search');
    if (!input) return;

    appState.searchQuery = input.value.trim().toLowerCase();
    if (clearBtn) {
      if (appState.searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }
    loadDataFromBackend();
  }

  function clearSearchInput() {
    var input = document.getElementById('search-input');
    var clearBtn = document.getElementById('btn-clear-search');
    if (input) input.value = '';
    if (clearBtn) clearBtn.classList.add('hidden');
    appState.searchQuery = '';
    loadDataFromBackend();
  }

  function setFilterStatus(status) {
    appState.currentFilter = status;
    var btns = document.querySelectorAll('.filter-btn');
    btns.forEach(function(btn) {
      if (btn.getAttribute('data-status') === status) {
        btn.className = 'filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#1E2238] text-[#FFFFFF]';
      } else {
        btn.className = 'filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-white text-gray-600 border border-gray-200';
      }
    });
    loadDataFromBackend();
  }

  function renderParticipantList() {
    var container = document.getElementById('participant-list-container');
    if (!container) return;

    if (!appState.peserta || appState.peserta.length === 0) {
      container.innerHTML = '<div class="card-modern p-8 text-center text-gray-400 text-xs font-semibold">' +
        'Tidak ada data peserta yang cocok dengan kriteria pencarian / filter.' +
      '</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < appState.peserta.length; i++) {
      var p = appState.peserta[i];
      var totalFamilyTab = p.jumlahTabungan || 0;
      var familyCount = 1 + (p.familyMembers ? p.familyMembers.length : 0);
      var mainSeat = findSeatInfoForPeserta(p.id);

      if (p.familyMembers && p.familyMembers.length > 0) {
        for (var f = 0; f < p.familyMembers.length; f++) {
          totalFamilyTab += (p.familyMembers[f].jumlahTabungan || 0);
        }
      }

      html += '<div class="card-modern p-5 md:p-6 space-y-4 hover:border-pink-200 transition-all shadow-sm">';
      
      // Header Card Utama
      html += '<div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-3 border-b border-gray-100">';
      html += '  <div class="flex items-start gap-3">';
      html += '    <div class="w-10 h-10 rounded-2xl bg-pink-100 text-[#EA6A9C] flex items-center justify-center font-black text-sm flex-shrink-0 mt-0.5">🏡</div>';
      html += '    <div>';
      html += '      <div class="flex items-center gap-2 flex-wrap">';
      html += '        <h3 class="text-base font-extrabold text-[#1E2238]">' + escapeHtml(p.nama) + '</h3>';
      html += '        <span class="px-2 py-0.5 bg-pink-50 text-[#EA6A9C] text-[10px] font-extrabold rounded-md">Kepala Keluarga</span>';
      html += '        <span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-[10px] font-mono font-bold rounded-md">' + escapeHtml(p.id) + '</span>';
      html += '      </div>';
      html += '      <p class="text-xs text-gray-500 mt-0.5 font-medium">' + escapeHtml(p.noRumah) + ' • Alamat: ' + escapeHtml(p.alamat) + '</p>';
      if (p.catatanLokasi) {
        html += '      <p class="text-[11px] text-gray-400 italic">Patokan: ' + escapeHtml(p.catatanLokasi) + '</p>';
      }
      html += '    </div>';
      html += '  </div>';

      // Badge Tabungan & Kursi
      html += '  <div class="flex flex-wrap items-center gap-2 self-start md:self-auto">';
      html += '    <span class="px-3 py-1 bg-indigo-50 text-[#5A56EC] text-xs font-extrabold rounded-xl border border-indigo-100">🚌 ' + escapeHtml(mainSeat) + '</span>';
      html += '    <span class="px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-extrabold rounded-xl border border-emerald-100">💰 Rp ' + totalFamilyTab.toLocaleString('id-ID') + '</span>';
      html += '  </div>';
      html += '</div>';

      // Action Buttons
      html += '<div class="flex flex-wrap items-center justify-between gap-2 text-xs pt-1">';
      html += '  <div class="flex items-center gap-2 flex-wrap">';
      html += '    <button onclick="openAddFamilyModal(\'' + p.id + '\', \'' + escapeHtml(p.nama) + '\')" class="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-[#5A56EC] font-bold rounded-xl border border-indigo-200 transition flex items-center gap-1.5 shadow-sm">';
      html += '      <span>+ Tambah Anggota</span>';
      html += '    </button>';
      html += '    <button onclick="openTabunganModal(\'' + p.id + '\')" class="px-3.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-xl border border-emerald-200 transition flex items-center gap-1.5 shadow-sm">';
      html += '      <span>💰 Log Tabungan</span>';
      html += '    </button>';
      html += '  </div>';

      if (appState.adminRole) {
        html += '  <button onclick="deleteParticipantProcess(\'' + p.id + '\')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl transition border border-rose-200 text-xs">';
        html += '    🗑️ Hapus KK & Anggota';
        html += '  </button>';
      }
      html += '</div>';

      // List Sub-Anggota Keluarga jika ada
      if (p.familyMembers && p.familyMembers.length > 0) {
        html += '<div class="mt-3 pt-3 border-t border-gray-100 space-y-2 bg-gray-50/70 p-3.5 rounded-2xl border">';
        html += '  <p class="text-[11px] font-extrabold text-gray-500 uppercase tracking-wider">Anggota Rombongan Keluarga (' + p.familyMembers.length + ' orang):</p>';
        
        for (var k = 0; k < p.familyMembers.length; k++) {
          var sub = p.familyMembers[k];
          var subSeat = findSeatInfoForPeserta(sub.id);

          html += '  <div class="bg-white p-2.5 rounded-xl border border-gray-200/80 flex items-center justify-between text-xs shadow-sm">';
          html += '    <div class="flex items-center gap-2">';
          html += '      <span class="w-2 h-2 rounded-full bg-[#EA6A9C]"></span>';
          html += '      <span class="font-bold text-[#1E2238]">' + escapeHtml(sub.nama) + '</span>';
          html += '      <span class="px-2 py-0.5 bg-gray-100 text-gray-500 rounded-md text-[10px] font-semibold">' + escapeHtml(sub.hubungan) + '</span>';
          html += '    </div>';
          
          html += '    <div class="flex items-center gap-2">';
          html += '      <span class="text-[11px] font-bold text-[#5A56EC]">🚌 ' + escapeHtml(subSeat) + '</span>';
          if (sub.jumlahTabungan > 0) {
            html += '      <span class="text-[11px] font-extrabold text-emerald-600">💰 Rp ' + (sub.jumlahTabungan || 0).toLocaleString('id-ID') + '</span>';
          }
          if (appState.adminRole) {
            html += '      <button onclick="openTabunganModal(\'' + sub.id + '\')" title="Input Tabungan Sub" class="px-2 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-[10px] font-bold">Setor</button>';
          }
          html += '    </div>';
          html += '  </div>';
        }
        html += '</div>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  function openTabunganModal(pesertaId) {
    var pObj = null;
    for (var i = 0; i < appState.peserta.length; i++) {
      if (appState.peserta[i].id === pesertaId) {
        pObj = appState.peserta[i];
        break;
      }
      if (appState.peserta[i].familyMembers) {
        for (var f = 0; f < appState.peserta[i].familyMembers.length; f++) {
          if (appState.peserta[i].familyMembers[f].id === pesertaId) {
            pObj = appState.peserta[i].familyMembers[f];
            break;
          }
        }
      }
    }

    if (!pObj) return;

    appState.activeTabunganPeserta = pObj;
    document.getElementById('tabungan-modal-nama').textContent = pObj.nama;
    document.getElementById('tabungan-modal-id').textContent = pObj.id;
    document.getElementById('tabungan-modal-total').textContent = 'Rp ' + (pObj.jumlahTabungan || 0).toLocaleString('id-ID');
    
    var adminForm = document.getElementById('admin-setor-form-container');
    if (adminForm) {
      if (appState.adminRole) {
        adminForm.classList.remove('hidden');
      } else {
        adminForm.classList.add('hidden');
      }
    }

    var inp = document.getElementById('input-setoran-nominal');
    if (inp) inp.value = '';

    loadTabunganLogs(pObj.id);
    openModal('modal-tabungan');
  }

  function loadTabunganLogs(idTransaksi) {
    var container = document.getElementById('tabungan-log-history');
    if (container) container.innerHTML = '<div class="text-center py-4 text-xs text-gray-400">Memuat riwayat...</div>';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(renderTabunganLogHistory)
        .withFailureHandler(function(err) {
          if (container) container.innerHTML = '<div class="text-center py-4 text-xs text-rose-500">Gagal memuat log</div>';
        })
        .getTabunganLog(idTransaksi);
    } else {
      var dummyLogs = {
        success: true,
        logs: [
          { idLog: 'LOG-0001', tanggal: '15/09/2026 19:18:30', idTransaksi: idTransaksi, nominalSetoran: 70000, totalTabungan: 120000, adminPenyetor: 'Super Admin' },
          { idLog: 'LOG-0002', tanggal: '15/09/2026 19:17:43', idTransaksi: idTransaksi, nominalSetoran: 50000, totalTabungan: 50000, adminPenyetor: 'Super Admin' }
        ]
      };
      renderTabunganLogHistory(dummyLogs);
    }
  }

  function renderTabunganLogHistory(res) {
    var container = document.getElementById('tabungan-log-history');
    if (!container) return;

    if (!res || !res.success || !res.logs || res.logs.length === 0) {
      container.innerHTML = '<div class="text-center py-4 text-xs text-gray-400 font-medium">Belum ada riwayat setoran tabungan.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < res.logs.length; i++) {
      var log = res.logs[i];
      var nominalFormat = 'Rp ' + (log.nominalSetoran || 0).toLocaleString('id-ID');

      html += '<div class="bg-gray-50 border border-gray-100 p-3.5 rounded-2xl flex items-center justify-between transition hover:bg-gray-100/80 shadow-sm">' +
                '<div>' +
                  '<p class="font-extrabold text-[#1E2238] text-xs">Setor: ' + nominalFormat + '</p>' +
                  '<p class="text-[10px] text-gray-400 mt-0.5 font-medium">' + escapeHtml(log.tanggal) + ' • tabungan telah di bayar ke PANITIA</p>' +
                '</div>' +
              '</div>';
    }
    container.innerHTML = html;
  }

  function submitTabunganDeposit() {
    if (!appState.activeTabunganPeserta) return;
    var inp = document.getElementById('input-setoran-nominal');
    var nominal = parseInt(inp ? inp.value : 0, 10);

    if (isNaN(nominal) || nominal <= 0) {
      showToast('Masukkan nominal setoran yang valid', 'error');
      return;
    }

    var btn = document.getElementById('btn-submit-setor');
    if (btn) btn.disabled = true;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) btn.disabled = false;
          if (res && res.success) {
            showToast(res.message, 'success');
            if (inp) inp.value = '';
            document.getElementById('tabungan-modal-total').textContent = 'Rp ' + res.totalTabungan.toLocaleString('id-ID');
            loadTabunganLogs(appState.activeTabunganPeserta.id);
            loadDataFromBackend();
          } else {
            showToast(res ? res.message : 'Gagal menambah setoran', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) btn.disabled = false;
          showToast('Error: ' + err.message, 'error');
        })
        .addTabunganDeposit(appState.activeTabunganPeserta.id, nominal, appState.adminRole);
    } else {
      if (btn) btn.disabled = false;
      showToast('Setoran Rp ' + nominal.toLocaleString('id-ID') + ' ditambahkan (Preview)', 'success');
      if (inp) inp.value = '';
      loadTabunganLogs(appState.activeTabunganPeserta.id);
    }
  }

  function openRekapWargaModal() {
    renderRekapWargaTable();
    openModal('modal-rekap-warga');
  }

  function renderRekapWargaTable() {
    var tbody = document.getElementById('rekap-warga-table-body');
    var tfoot = document.getElementById('rekap-warga-table-foot');
    if (!tbody) return;

    if (!appState.peserta || appState.peserta.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Tidak ada data warga.</td></tr>';
      if (tfoot) tfoot.innerHTML = '';
      return;
    }

    var html = '';
    var counter = 1;
    var totalSeluruhPeserta = 0;

    for (var i = 0; i < appState.peserta.length; i++) {
      var head = appState.peserta[i];
      var familyBg = (i % 2 === 0) ? 'bg-white' : 'bg-pink-50/30';
      var headSeat = findSeatInfoForPeserta(head.id);
      totalSeluruhPeserta++;

      html += '<tr class="' + familyBg + ' hover:bg-pink-100/40 transition-colors border-b border-gray-100">' +
                '<td class="p-2.5 text-center font-mono font-bold text-gray-500 border-r border-gray-200">' + counter++ + '</td>' +
                '<td class="p-2.5 font-extrabold text-[#1E2238] border-r border-gray-200">' + escapeHtml(head.nama) + '</td>' +
                '<td class="p-2.5 font-bold text-gray-800 border-r border-gray-200">' + escapeHtml(head.nama) + '</td>' +
                '<td class="p-2.5 border-r border-gray-200"><span class="px-2 py-0.5 bg-pink-100 text-[#EA6A9C] rounded font-extrabold text-[10px]">Kepala Keluarga</span></td>' +
                '<td class="p-2.5 text-center font-bold text-gray-700 border-r border-gray-200">' + escapeHtml(head.noRumah) + '</td>' +
                '<td class="p-2.5 text-center font-mono text-xs border-r border-gray-200">' + escapeHtml(head.noWhatsapp) + '</td>' +
                '<td class="p-2.5 text-center font-extrabold text-[#5A56EC]">' + escapeHtml(headSeat) + '</td>' +
              '</tr>';

      if (head.familyMembers && head.familyMembers.length > 0) {
        for (var f = 0; f < head.familyMembers.length; f++) {
          var sub = head.familyMembers[f];
          var subSeat = findSeatInfoForPeserta(sub.id);
          totalSeluruhPeserta++;

          html += '<tr class="' + familyBg + ' hover:bg-pink-100/40 transition-colors border-b border-gray-100">' +
                    '<td class="p-2.5 text-center font-mono text-gray-400 border-r border-gray-200">' + counter++ + '</td>' +
                    '<td class="p-2.5 text-gray-400 text-[11px] border-r border-gray-200">└ ' + escapeHtml(head.nama) + '</td>' +
                    '<td class="p-2.5 font-medium text-gray-700 border-r border-gray-200 pl-5">↳ ' + escapeHtml(sub.nama) + '</td>' +
                    '<td class="p-2.5 border-r border-gray-200"><span class="px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-semibold">' + escapeHtml(sub.hubungan) + '</span></td>' +
                    '<td class="p-2.5 text-center text-gray-500 border-r border-gray-200">' + escapeHtml(head.noRumah) + '</td>' +
                    '<td class="p-2.5 text-center font-mono text-xs text-gray-400 border-r border-gray-200">' + escapeHtml(head.noWhatsapp) + '</td>' +
                    '<td class="p-2.5 text-center font-bold text-[#5A56EC]">' + escapeHtml(subSeat) + '</td>' +
                  '</tr>';
        }
      }
    }

    tbody.innerHTML = html;
    if (tfoot) {
      tfoot.innerHTML = '<tr>' +
                          '<td colspan="3" class="p-3 text-right uppercase tracking-wider text-xs">Total Seluruh Peserta:</td>' +
                          '<td colspan="4" class="p-3 text-left font-black text-[#EA6A9C] text-sm">' + totalSeluruhPeserta + ' Warga Rombongan</td>' +
                        '</tr>';
    }
  }

  function openRekapTabunganModal() {
    renderRekapTabunganTable();
    openModal('modal-rekap-tabungan');
  }

  function renderRekapTabunganTable() {
    var tbody = document.getElementById('rekap-tabungan-table-body');
    var tfoot = document.getElementById('rekap-tabungan-table-foot');
    if (!tbody) return;

    if (!appState.peserta || appState.peserta.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Tidak ada data tabungan.</td></tr>';
      if (tfoot) tfoot.innerHTML = '';
      return;
    }

    var html = '';
    var counter = 1;
    var totalGrandTabungan = 0;

    for (var i = 0; i < appState.peserta.length; i++) {
      var head = appState.peserta[i];
      var familyBg = (i % 2 === 0) ? 'bg-white' : 'bg-emerald-50/30';
      
      var totalFamTab = head.jumlahTabungan || 0;
      if (head.familyMembers && head.familyMembers.length > 0) {
        for (var f = 0; f < head.familyMembers.length; f++) {
          totalFamTab += (head.familyMembers[f].jumlahTabungan || 0);
        }
      }
      totalGrandTabungan += totalFamTab;

      html += '<tr class="' + familyBg + ' hover:bg-emerald-100/40 transition-colors border-b border-gray-100">' +
                '<td class="p-2.5 text-center font-mono font-bold text-gray-500 border-r border-gray-200">' + counter++ + '</td>' +
                '<td class="p-2.5 font-extrabold text-[#1E2238] border-r border-gray-200">' + escapeHtml(head.nama) + '</td>' +
                '<td class="p-2.5 font-bold text-gray-800 border-r border-gray-200">' + escapeHtml(head.nama) + '</td>' +
                '<td class="p-2.5 border-r border-gray-200"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-extrabold text-[10px]">Kepala Keluarga</span></td>' +
                '<td class="p-2.5 text-center font-bold text-gray-700 border-r border-gray-200">' + escapeHtml(head.noRumah) + '</td>' +
                '<td class="p-2.5 text-right font-mono font-bold text-emerald-700 border-r border-gray-200">Rp ' + (head.jumlahTabungan || 0).toLocaleString('id-ID') + '</td>' +
                '<td class="p-2.5 text-right font-mono font-black text-emerald-800 bg-emerald-100/40">Rp ' + totalFamTab.toLocaleString('id-ID') + '</td>' +
              '</tr>';

      if (head.familyMembers && head.familyMembers.length > 0) {
        for (var k = 0; k < head.familyMembers.length; k++) {
          var sub = head.familyMembers[k];
          html += '<tr class="' + familyBg + ' hover:bg-emerald-100/40 transition-colors border-b border-gray-100">' +
                    '<td class="p-2.5 text-center font-mono text-gray-400 border-r border-gray-200">' + counter++ + '</td>' +
                    '<td class="p-2.5 text-gray-400 text-[11px] border-r border-gray-200">└ ' + escapeHtml(head.nama) + '</td>' +
                    '<td class="p-2.5 font-medium text-gray-700 border-r border-gray-200 pl-5">↳ ' + escapeHtml(sub.nama) + '</td>' +
                    '<td class="p-2.5 border-r border-gray-200"><span class="px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-semibold">' + escapeHtml(sub.hubungan) + '</span></td>' +
                    '<td class="p-2.5 text-center text-gray-500 border-r border-gray-200">' + escapeHtml(head.noRumah) + '</td>' +
                    '<td class="p-2.5 text-right font-mono text-emerald-600 border-r border-gray-200">Rp ' + (sub.jumlahTabungan || 0).toLocaleString('id-ID') + '</td>' +
                    '<td class="p-2.5 text-right font-mono text-gray-400 bg-emerald-100/20 text-[11px]">-</td>' +
                  '</tr>';
        }
      }
    }

    tbody.innerHTML = html;
    if (tfoot) {
      tfoot.innerHTML = '<tr>' +
                          '<td colspan="5" class="p-3 text-right uppercase tracking-wider text-xs">Total Seluruh Tabungan Warga:</td>' +
                          '<td colspan="2" class="p-3 text-right font-black text-emerald-800 text-base">Rp ' + totalGrandTabungan.toLocaleString('id-ID') + '</td>' +
                        '</tr>';
    }
  }

  function openRekapSumbanganModal() {
    renderRekapSumbanganTable();
    openModal('modal-rekap-sumbangan');
  }

  function renderRekapSumbanganTable() {
    var tbody = document.getElementById('rekap-sumbangan-table-body');
    var tfoot = document.getElementById('rekap-sumbangan-table-foot');
    if (!tbody) return;

    var adminCols = document.querySelectorAll('.admin-action-col');
    adminCols.forEach(function(col) {
      if (appState.adminRole) {
        col.classList.remove('hidden');
      } else {
        col.classList.add('hidden');
      }
    });

    if (!appState.sumbanganList || appState.sumbanganList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-400">Belum ada catatan dana sumbangan / donatur.</td></tr>';
      if (tfoot) tfoot.innerHTML = '';
      return;
    }

    var html = '';
    var totalGrandSumbangan = 0;

    for (var i = 0; i < appState.sumbanganList.length; i++) {
      var smb = appState.sumbanganList[i];
      var bgClass = (i % 2 === 0) ? 'bg-white' : 'bg-amber-50/40';
      var nominalVal = smb.nominal || 0;
      totalGrandSumbangan += nominalVal;

  function renderBusSeats() {
    var rowsContainer = document.getElementById('bus-rows-container');
    var row8Container = document.getElementById('bus-row-8-container');
    if (!rowsContainer || !row8Container) return;

    var currentBusSeats = (appState.seats || []).filter(function(s) {
      return s.idBus === appState.currentBusId;
    });

    var rowsHtml = '';
    for (var r = 1; r <= 7; r++) {
      var rowSeats = currentBusSeats.filter(function(s) { return s.baris === r; });
      rowSeats.sort(function(a, b) { return parseInt(a.noKursi, 10) - parseInt(b.noKursi, 10); });

      var s1 = rowSeats[0] || { noKursi: String((r-1)*4 + 1) };
      var s2 = rowSeats[1] || { noKursi: String((r-1)*4 + 2) };
      var s3 = rowSeats[2] || { noKursi: String((r-1)*4 + 3) };
      var s4 = rowSeats[3] || { noKursi: String((r-1)*4 + 4) };

      rowsHtml += '<div class="grid grid-cols-11 gap-1 md:gap-2 items-center text-center text-xs font-bold">';
      rowsHtml += buildSeatButtonHtml(s1, 'col-span-2');
      rowsHtml += buildSeatButtonHtml(s2, 'col-span-2');
      rowsHtml += '<div class="col-span-3 text-[10px] text-gray-400 font-semibold tracking-widest uppercase">Baris ' + r + '</div>';
      rowsHtml += buildSeatButtonHtml(s3, 'col-span-2');
      rowsHtml += buildSeatButtonHtml(s4, 'col-span-2');
      rowsHtml += '</div>';
    }
    rowsContainer.innerHTML = rowsHtml;

    var row8Seats = currentBusSeats.filter(function(s) { return s.baris === 8; });
    row8Seats.sort(function(a, b) { return parseInt(a.noKursi, 10) - parseInt(b.noKursi, 10); });

    var row8Html = '';
    for (var b = 0; b < 5; b++) {
      var s8 = row8Seats[b] || { noKursi: String(29 + b) };
      row8Html += buildSeatButtonHtml(s8, 'w-full');
    }
    row8Container.innerHTML = row8Html;
  }

  function buildSeatButtonHtml(seat, colClass) {
    var seatNoPadded = ('0' + seat.noKursi).slice(-2);
    var isOccupied = seat.namaTerisi && seat.namaTerisi.trim() !== '';
    var isSelectedForSwap = appState.selectedSeatForSwap &&
                            appState.selectedSeatForSwap.idBus === seat.idBus &&
                            appState.selectedSeatForSwap.noKursi === seat.noKursi;

    var bgStyle = 'bg-white border-2 border-gray-200 text-gray-400 hover:border-indigo-300';
    if (isOccupied) {
      bgStyle = 'bg-[#265768] text-white border-2 border-[#1b3e4a] shadow-sm';
    }
    if (isSelectedForSwap) {
      bgStyle = 'bg-[#EA6A9C] text-white border-2 border-pink-400 animate-pulse shadow-lg';
    }

    var cursorStyle = 'cursor-pointer hover:scale-105 active:scale-95 transition-all';
    var clickAttr = 'onclick="handleSeatClick(\'' + seat.idBus + '\', \'' + seat.noKursi + '\')"';

    var html = '<div ' + clickAttr + ' class="' + colClass + ' ' + bgStyle + ' ' + cursorStyle + ' p-2 md:p-2.5 rounded-2xl flex flex-col items-center justify-between min-h-[64px] relative overflow-hidden group" title="' + (isOccupied ? escapeHtml(seat.namaTerisi) : 'Kosong') + '">';
    html += '  <div class="flex items-center justify-between w-full text-[10px] font-black opacity-80">';
    html += '    <span>' + seatNoPadded + '</span>';
    html += '    <span class="w-1.5 h-1.5 rounded-full ' + (isOccupied ? 'bg-emerald-400' : 'bg-gray-300') + '"></span>';
    html += '  </div>';
    html += '  <span class="text-[11px] font-extrabold truncate w-full mt-1 text-center leading-tight">' + (isOccupied ? escapeHtml(seat.namaTerisi) : 'Kosong') + '</span>';
    html += '</div>';

    return html;
  }

  function handleSeatClick(busId, noKursi) {
    if (appState.adminRole && appState.selectedSeatForSwap) {
      var seatA = appState.selectedSeatForSwap;
      var seatB = { idBus: busId, noKursi: noKursi };

      if (seatA.idBus === seatB.idBus && seatA.noKursi === seatB.noKursi) {
        appState.selectedSeatForSwap = null;
        showToast('Batal menukar kursi', 'info');
        renderBusSeats();
        return;
      }

      showToast('Menukar posisi kursi...', 'info');
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            appState.selectedSeatForSwap = null;
            if (res && res.success) {
              showToast(res.message, 'success');
              loadDataFromBackend();
            } else {
              showToast(res ? res.message : 'Gagal menukar', 'error');
              renderBusSeats();
            }
          })
          .withFailureHandler(function(err) {
            appState.selectedSeatForSwap = null;
            showToast('Error: ' + err.message, 'error');
            renderBusSeats();
          })
          .swapBusSeats(seatA.idBus, seatA.noKursi, seatB.idBus, seatB.noKursi);
      } else {
        appState.selectedSeatForSwap = null;
        showToast('Preview: Kursi (' + seatA.noKursi + ') & (' + seatB.noKursi + ') ditukar!', 'success');
        renderBusSeats();
      }
      return;
    }

    openSeatDetailModal(busId, noKursi);
  }

  function openSeatDetailModal(busId, noKursi) {
    var seat = (appState.seats || []).find(function(s) {
      return s.idBus === busId && String(s.noKursi) === String(noKursi);
    });

    var seatNoPadded = ('0' + noKursi).slice(-2);
    var seatCodeStr = busId + ' (' + seatNoPadded + ')';
    
    var isOccupied = seat && seat.namaTerisi && seat.namaTerisi.trim() !== '';
    var namaTerisi = isOccupied ? seat.namaTerisi : '';

    var titleEl = document.getElementById('seat-modal-title');
    var badgeEl = document.getElementById('seat-modal-code');
    var bodyOccupied = document.getElementById('seat-modal-body-occupied');
    var bodyEmpty = document.getElementById('seat-modal-body-empty');
    var nameEl = document.getElementById('seat-modal-passenger-name');
    var emptyMsgEl = document.getElementById('seat-modal-empty-msg');
    var waBtn = document.getElementById('seat-modal-wa-btn');
    var adminSwapBtn = document.getElementById('seat-modal-admin-swap-btn');

    if (badgeEl) badgeEl.textContent = seatCodeStr;

    if (isOccupied) {
      if (titleEl) titleEl.textContent = 'Detail Pemegang Kursi';
      if (bodyOccupied) bodyOccupied.classList.remove('hidden');
      if (bodyEmpty) bodyEmpty.classList.add('hidden');
      if (nameEl) nameEl.textContent = namaTerisi;
    } else {
      if (titleEl) titleEl.textContent = 'Informasi Kursi Bus';
      if (bodyOccupied) bodyOccupied.classList.add('hidden');
      if (bodyEmpty) bodyEmpty.classList.remove('hidden');
      
      var emptyText = 'Kursi kosong, Jika ingin mengisi kursi ' + seatCodeStr + ' harap hubungi panitia.';
      if (emptyMsgEl) emptyMsgEl.textContent = emptyText;

      var waText = "Assalamu'alaikum Admin Halal Bihalal RT,\n\nSaya ingin menanyakan/mengisi kursi yang masih kosong: *" + seatCodeStr + "*.\n\nMohon informasinya. Terima kasih!";

          closeModal('modal-seat-detail');
          appState.selectedSeatForSwap = { idBus: busId, noKursi: noKursi };
          showToast('Pilih kursi kedua untuk menukar posisi kursi (' + busId + ' - ' + noKursi + ')', 'info');
          renderBusSeats();
        };

        adminSwapBtn.classList.add('hidden');

  }

        .withSuccessHandler(function(res) {
          if (res && res.success) {
            var blob = new Blob([res.backupJson], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'BACKUP_DATABASE_HALAL_BIHALAL_' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('Backup JSON berhasil diunduh!', 'success');
          } else {
            showToast(res ? res.message : 'Gagal backup', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message, 'error');
        })
        .backupDatabase();
    } else {
      showToast('Preview Mode: Fitur Backup aktif di Apps Script', 'info');

  }

  function triggerClearAllDatabase() {
    if (appState.adminRole !== 'Super Admin') {
      showToast('Akses ditolak. Reset database khusus Super Admin!', 'error');
      return;
    }

    var confirmMsg = '💥 PERINGATAN SUPER ADMIN! 💥\n\n' +
      'Apakah Anda YAKIN ingin MENGHAPUS SEMUA DATABASE PESERTA, TABUNGAN, DANA SUMBANGAN & KURSI BUS?\n\n' +
      'Tindakan ini TIDAK DAPAT DIBATALKAN. Pastikan Anda sudah membuat BACKUP JSON terlebih dahulu!';

    if (!confirm(confirmMsg)) return;

    showToast('Mengosongkan seluruh database...', 'info');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showToast(res.message, 'success');
            loadDataFromBackend();
          } else {
            showToast(res ? res.message : 'Gagal reset database', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message, 'error');
        })
        .clearAllDatabase(appState.adminRole);
    } else {
      showToast('Preview: Database berhasil dikosongkan', 'success');
    }
  }
</script>
