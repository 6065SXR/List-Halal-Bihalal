<script>
  var appState = {
    peserta: [],
    seats: [],
    stats: {},
    currentBusId: 'Bus 1',
    adminRole: null,
    currentFilter: 'SEMUA',
    searchQuery: '',
    selectedSeatForSwap: null,
    activeTabunganPeserta: null,
    adminWaPhone: '6281234567890',
    currentInfoHari: 'Hari 1',
    rundownList: [],
    kontakList: []
  };

  var previewDummyRundown = [
    { id: 'RD-001', hari: 'Hari 1', jam: '06:00 - 06:30', judul: 'Kumpul & Absensi Peserta Bus', keterangan: 'Titik Kumpul: Kp. Baru I Jl. Marga Mulya (Depan Pos Satpam RT 03)' },
    { id: 'RD-002', hari: 'Hari 1', jam: '06:45 WIB', judul: 'Keberangkatan Bus Medium 1 & Bus 2', keterangan: 'Seluruh armada berangkat bersama. Mohon hadir tepat waktu!' },
    { id: 'RD-003', hari: 'Hari 1', jam: '09:30 - 11:30', judul: 'Pembukaan, Tausiyah & Halal Bihalal', keterangan: 'Sambutan Ketua RT, Mushafahah/Salaman Warga, dan Tausiyah Agama' },
    { id: 'RD-004', hari: 'Hari 1', jam: '11:30 - 13:30', judul: 'Makan Siang & Ramah Tamah', keterangan: 'Santap Catering bersama & Pembagian Doorprize Digital' },
    { id: 'RD-005', hari: 'Hari 1', jam: '15:30 WIB', judul: 'Persiapan Pulang ke Kamp Baru I', keterangan: 'Pengecekan ulang seluruh anggota keluarga di Bus 1 & Bus 2' },
    { id: 'RD-006', hari: 'Hari 2', jam: '07:30 - 09:00', judul: 'Senam Pagi Warga & Sarapan Bersama', keterangan: 'Area Lapangan Villa / Resort Halal Bihalal' },
    { id: 'RD-007', hari: 'Hari 2', jam: '09:30 - 12:00', judul: 'Fun Games Warga & Pembagian Hadiah', keterangan: 'Lomba keakraban antar RT & Door Prize Utama' },
    { id: 'RD-008', hari: 'Hari 2', jam: '13:00 WIB', judul: 'Check Out & Perjalanan Pulang', keterangan: 'Seluruh armada bus kembali ke Jakarta' }
  ];

  var previewDummyKontak = [
    { id: 'KT-001', jabatan: 'Koordinator Bus 1', nama: 'Pak Agus', noWhatsapp: '081234567890' },
    { id: 'KT-002', jabatan: 'Koordinator Bus 2', nama: 'Tommy H', noWhatsapp: '081234567890' },
    { id: 'KT-003', jabatan: 'Ketua RT 03', nama: 'Pak Sugeng', noWhatsapp: '081398765432' }
  ];

  var previewDummySeats = [];
  (function initPreviewSeats() {
    ['Bus 1', 'Bus 2'].forEach(function(busId) {
      for (var r = 1; r <= 7; r++) {
        var startNum = (r - 1) * 4 + 1;
        var s1 = ('0' + startNum).slice(-2);
        var s2 = ('0' + (startNum + 1)).slice(-2);
        var s3 = ('0' + (startNum + 2)).slice(-2);
        var s4 = ('0' + (startNum + 3)).slice(-2);

        previewDummySeats.push({ idBus: busId, noKursi: s1, baris: r, tipeKursi: 'Window (Kiri)', idPeserta: (busId==='Bus 1' && r === 1) ? 'HAL-0001' : '', namaTerisi: (busId==='Bus 1' && r === 1) ? 'Budi Santoso' : '' });
        previewDummySeats.push({ idBus: busId, noKursi: s2, baris: r, tipeKursi: 'Aisle (Kiri)', idPeserta: (busId==='Bus 1' && r === 1) ? 'HAL-0002' : '', namaTerisi: (busId==='Bus 1' && r === 1) ? 'Siti Aminah' : '' });
        previewDummySeats.push({ idBus: busId, noKursi: s3, baris: r, tipeKursi: 'Aisle (Kanan)', idPeserta: (busId==='Bus 1' && r === 1) ? 'HAL-0003' : '', namaTerisi: (busId==='Bus 1' && r === 1) ? 'Rizky Pratama' : '' });
        previewDummySeats.push({ idBus: busId, noKursi: s4, baris: r, tipeKursi: 'Window (Kanan)', idPeserta: (busId==='Bus 1' && r === 1) ? 'HAL-0004' : '', namaTerisi: (busId==='Bus 1' && r === 1) ? 'Dewi Lestari' : '' });
      }
      for (var b = 29; b <= 33; b++) {
        previewDummySeats.push({ idBus: busId, noKursi: String(b), baris: 8, tipeKursi: 'Belakang Penuh', idPeserta: '', namaTerisi: '' });
      }
    });
  })();

  document.addEventListener('DOMContentLoaded', function() {
    loadDataFromBackend();
    
    // Otomatis Tampilkan Dialog Himbauan PIN Akses 70% Layar Saat Pertama Dibuka
    setTimeout(function() {
      openModal('modal-welcome-pin-guide');
    }, 400);
  });

  function loadDataFromBackend() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            appState.peserta = res.data.peserta || [];
            appState.seats = res.data.seats || [];
            appState.stats = res.data.stats || {};
            if (res.data.info) {
              appState.rundownList = res.data.info.rundown || [];
              appState.kontakList = res.data.info.kontak || [];
            }
            renderAll();
          } else {
            showToast(res ? res.message : 'Gagal memuat data', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Koneksi backend gagal: ' + err.message, 'error');
        })
        .getAppData(appState.searchQuery, appState.currentFilter);
    } else {
      appState.peserta = [
        { id: 'HAL-0001', nama: 'Budi Santoso', noRumah: 'No. 12', catatanLokasi: 'Dekat pos satpam', noWhatsapp: '081234567890', jumlahTabungan: 500000, familyMembers: [{ id: 'HAL-0002', nama: 'Siti Aminah', hubungan: 'Istri', jumlahTabungan: 0 }, { id: 'HAL-0003', nama: 'Rizky Pratama', hubungan: 'Anak 1', jumlahTabungan: 0 }] },
        { id: 'HAL-0004', nama: 'Dewi Lestari', noRumah: 'No. 05', catatanLokasi: 'Depan pos satpam', noWhatsapp: '081876543210', jumlahTabungan: 200000, familyMembers: [] }
      ];
      appState.seats = previewDummySeats;
      appState.rundownList = previewDummyRundown;
      appState.kontakList = previewDummyKontak;
      appState.stats = {
        totalWarga: 4,
        totalKepalaKeluarga: 2,
        totalTabungan: 700000,
        kursiTerisiBus1: 4,
        kursiTerisiBus2: 0
      };
      renderAll();
    }
  }

  function renderAll() {
    renderStats();
    renderParticipantList();
    renderBusSeats();
    renderInfoTab();
  }

  function findSeatInfoForPeserta(idOrName) {
    if (!appState.seats || appState.seats.length === 0) return '-';
    var found = appState.seats.find(function(s) {
      return (s.idPeserta && s.idPeserta === idOrName) || (s.namaTerisi && s.namaTerisi.toLowerCase().trim() === String(idOrName).toLowerCase().trim());
    });
    if (found && found.idBus) {
      return found.idBus + ' (' + ('0' + found.noKursi).slice(-2) + ')';
    }
    return '-';
  }

  function openRekapWargaModal() {
    var tbody = document.getElementById('rekap-warga-table-body');
    var tfoot = document.getElementById('rekap-warga-table-foot');
    if (!tbody) return;

    var list = appState.peserta || [];
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Belum ada peserta terdaftar.</td></tr>';
      tfoot.innerHTML = '';
      openModal('modal-rekap-warga');
      return;
    }

    var html = '';
    var globalNo = 1;
    var familyGroupIndex = 0;
    var totalWargaCount = 0;

    for (var i = 0; i < list.length; i++) {
      var head = list[i];
      var familyMembers = head.familyMembers || [];
      var familyCount = 1 + familyMembers.length;
      totalWargaCount += familyCount;

      var bgClass = (familyGroupIndex % 2 === 0) ? 'bg-[#F2F4F8]' : 'bg-white';
      var kkName = escapeHtml(head.nama);
      var seatHead = findSeatInfoForPeserta(head.id || head.nama);

      // Baris Kepala Keluarga (KK)
      html += '<tr class="' + bgClass + ' hover:opacity-95 border-b border-gray-200/80 transition">';
      html += '  <td class="p-2.5 text-center font-bold text-gray-500 border-r border-gray-200/60">' + (globalNo++) + '</td>';
      html += '  <td class="p-2.5 font-extrabold text-[#1E2238] border-r border-gray-200/60">' + kkName + '</td>';
      html += '  <td class="p-2.5 font-bold text-[#1E2238] border-r border-gray-200/60">' + kkName + '</td>';
      html += '  <td class="p-2.5 border-r border-gray-200/60"><span class="px-2 py-0.5 rounded-md bg-pink-100 text-pink-700 font-extrabold text-[10px]">Kepala Keluarga</span></td>';
      html += '  <td class="p-2.5 text-center border-r border-gray-200/60 font-semibold">' + escapeHtml(head.noRumah || '-') + '</td>';
      html += '  <td class="p-2.5 text-center border-r border-gray-200/60 font-mono text-[#5A56EC] font-bold">' + escapeHtml(head.noWhatsapp || '-') + '</td>';
      html += '  <td class="p-2.5 text-center font-extrabold text-indigo-600">' + seatHead + '</td>';
      html += '</tr>';

      // Baris Anggota Keluarga
      for (var f = 0; f < familyMembers.length; f++) {
        var sub = familyMembers[f];
        var seatSub = findSeatInfoForPeserta(sub.id || sub.nama);
        html += '<tr class="' + bgClass + ' hover:opacity-95 border-b border-gray-200/80 transition">';
        html += '  <td class="p-2.5 text-center font-bold text-gray-400 border-r border-gray-200/60">' + (globalNo++) + '</td>';
        html += '  <td class="p-2.5 text-gray-400 italic border-r border-gray-200/60 text-[11px]">' + kkName + '</td>';
        html += '  <td class="p-2.5 font-bold text-gray-800 border-r border-gray-200/60 pl-5">└ ' + escapeHtml(sub.nama) + '</td>';
        html += '  <td class="p-2.5 border-r border-gray-200/60"><span class="px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 font-bold text-[10px]">' + escapeHtml(sub.hubungan || 'Anggota') + '</span></td>';
        html += '  <td class="p-2.5 text-center border-r border-gray-200/60 text-gray-500">' + escapeHtml(head.noRumah || '-') + '</td>';
        html += '  <td class="p-2.5 text-center border-r border-gray-200/60 font-mono text-gray-400 text-[11px]">' + escapeHtml(head.noWhatsapp || '-') + '</td>';
        html += '  <td class="p-2.5 text-center font-bold text-indigo-500">' + seatSub + '</td>';
        html += '</tr>';
      }

      familyGroupIndex++;
    }

    tbody.innerHTML = html;

    var footHtml = '';
    footHtml += '<tr class="bg-gray-200 font-black text-center text-xs text-[#1E2238] border-t-2 border-gray-400">';
    footHtml += '  <td colspan="3" class="p-3 text-left uppercase tracking-wider">TOTAL MANIFEST PESERTA:</td>';
    footHtml += '  <td colspan="4" class="p-3 text-right text-pink-600 font-extrabold text-sm">' + totalWargaCount + ' Peserta Terdaftar</td>';
    footHtml += '</tr>';
    tfoot.innerHTML = footHtml;

    openModal('modal-rekap-warga');
  }

  function openRekapTabunganModal() {
    var tbody = document.getElementById('rekap-tabungan-table-body');
    var tfoot = document.getElementById('rekap-tabungan-table-foot');
    if (!tbody) return;

    var list = appState.peserta || [];
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Belum ada data tabungan terdaftar.</td></tr>';
      tfoot.innerHTML = '';
      openModal('modal-rekap-tabungan');
      return;
    }

    var html = '';
    var globalNo = 1;
    var familyGroupIndex = 0;
    var grandTotalTabungan = 0;

    for (var i = 0; i < list.length; i++) {
      var head = list[i];
      var familyMembers = head.familyMembers || [];

      var totalFamilyTab = head.jumlahTabungan || 0;
      for (var fCount = 0; fCount < familyMembers.length; fCount++) {
        totalFamilyTab += (familyMembers[fCount].jumlahTabungan || 0);
      }
      grandTotalTabungan += totalFamilyTab;

      var bgClass = (familyGroupIndex % 2 === 0) ? 'bg-[#F2F4F8]' : 'bg-white';
      var kkName = escapeHtml(head.nama);
      var headTabVal = head.jumlahTabungan || 0;

      // Baris Kepala Keluarga (KK)
      html += '<tr class="' + bgClass + ' hover:opacity-95 border-b border-gray-200/80 transition">';
      html += '  <td class="p-2.5 text-center font-bold text-gray-500 border-r border-gray-200/60">' + (globalNo++) + '</td>';
      html += '  <td class="p-2.5 font-extrabold text-[#1E2238] border-r border-gray-200/60">' + kkName + '</td>';
      html += '  <td class="p-2.5 font-bold text-[#1E2238] border-r border-gray-200/60">' + kkName + '</td>';
      html += '  <td class="p-2.5 border-r border-gray-200/60"><span class="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-extrabold text-[10px]">Kepala Keluarga</span></td>';
      html += '  <td class="p-2.5 text-center border-r border-gray-200/60 font-semibold">' + escapeHtml(head.noRumah || '-') + '</td>';
      html += '  <td class="p-2.5 text-right font-bold text-gray-800 border-r border-gray-200/60 font-mono">Rp ' + headTabVal.toLocaleString('id-ID') + '</td>';
      html += '  <td class="p-2.5 text-right font-extrabold text-emerald-700 font-mono bg-emerald-50/50">Rp ' + totalFamilyTab.toLocaleString('id-ID') + '</td>';
      html += '</tr>';

      // Baris Anggota Keluarga
      for (var f = 0; f < familyMembers.length; f++) {
        var sub = familyMembers[f];
        var subTabVal = sub.jumlahTabungan || 0;
        html += '<tr class="' + bgClass + ' hover:opacity-95 border-b border-gray-200/80 transition">';
        html += '  <td class="p-2.5 text-center font-bold text-gray-400 border-r border-gray-200/60">' + (globalNo++) + '</td>';
        html += '  <td class="p-2.5 text-gray-400 italic border-r border-gray-200/60 text-[11px]">' + kkName + '</td>';
        html += '  <td class="p-2.5 font-bold text-gray-800 border-r border-gray-200/60 pl-5">└ ' + escapeHtml(sub.nama) + '</td>';
        html += '  <td class="p-2.5 border-r border-gray-200/60"><span class="px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 font-bold text-[10px]">' + escapeHtml(sub.hubungan || 'Anggota') + '</span></td>';
        html += '  <td class="p-2.5 text-center border-r border-gray-200/60 text-gray-500">' + escapeHtml(head.noRumah || '-') + '</td>';
        html += '  <td class="p-2.5 text-right font-semibold text-gray-600 border-r border-gray-200/60 font-mono">Rp ' + subTabVal.toLocaleString('id-ID') + '</td>';
        html += '  <td class="p-2.5 text-right text-gray-400 font-mono text-[11px] bg-emerald-50/30">-</td>';
        html += '</tr>';
      }

      familyGroupIndex++;
    }

    tbody.innerHTML = html;

    var footHtml = '';
    footHtml += '<tr class="bg-emerald-100 font-black text-center text-xs text-emerald-950 border-t-2 border-emerald-400">';
    footHtml += '  <td colspan="4" class="p-3 text-left uppercase tracking-wider">GRAND TOTAL TABUNGAN WARGA:</td>';
    footHtml += '  <td colspan="3" class="p-3 text-right text-emerald-800 font-black text-sm font-mono">Rp ' + grandTotalTabungan.toLocaleString('id-ID') + '</td>';
    footHtml += '</tr>';
    tfoot.innerHTML = footHtml;

    openModal('modal-rekap-tabungan');
  }

  function switchInfoHari(hari) {
    appState.currentInfoHari = hari;
    document.getElementById('info-current-hari-label').textContent = hari.toUpperCase();

    var btn1 = document.getElementById('btn-info-hari1');
    var btn2 = document.getElementById('btn-info-hari2');

    if (hari === 'Hari 1') {
      btn1.className = 'px-4 py-2 rounded-xl text-xs font-extrabold transition bg-[#5A56EC] text-white shadow-sm';
      btn2.className = 'px-4 py-2 rounded-xl text-xs font-extrabold transition text-gray-600 hover:text-gray-900';
    } else {
      btn2.className = 'px-4 py-2 rounded-xl text-xs font-extrabold transition bg-[#5A56EC] text-white shadow-sm';
      btn1.className = 'px-4 py-2 rounded-xl text-xs font-extrabold transition text-gray-600 hover:text-gray-900';
    }

    renderInfoTab();
  }

  function renderInfoTab() {
    renderRundownList();
    renderKontakList();
  }

  function renderRundownList() {
    var container = document.getElementById('rundown-items-container');
    if (!container) return;

    var currentHari = appState.currentInfoHari || 'Hari 1';
    var filtered = (appState.rundownList || []).filter(function(item) {
      return item.hari === currentHari;
    });

    if (!filtered || filtered.length === 0) {
      container.innerHTML = '<div class="text-center py-6 text-gray-400">Belum ada agenda untuk ' + currentHari + '.</div>';
      return;
    }

    var html = '';

    for (var i = 0; i < filtered.length; i++) {
      var rd = filtered[i];

      html += '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3.5 md:p-4 rounded-2xl border border-gray-100 shadow-sm transition hover:shadow-md">';
      html += '  <div class="flex items-start sm:items-center gap-3.5 flex-1 min-w-0">';
      html += '    <span class="w-28 sm:w-36 flex-shrink-0 text-center font-extrabold text-[#EA6A9C] bg-pink-50 border border-pink-100 px-3 py-1.5 rounded-xl text-xs font-mono">' + escapeHtml(rd.jam) + '</span>';
      html += '    <div class="min-w-0 flex-1 pl-1">';
      html += '      <p class="font-bold text-[#1E2238] text-xs md:text-sm">' + escapeHtml(rd.judul) + '</p>';
      html += '      <p class="text-gray-500 text-[11px] mt-0.5">' + escapeHtml(rd.keterangan || '-') + '</p>';
      html += '    </div>';
      html += '  </div>';

      if (appState.adminRole) {
        html += '  <div class="flex items-center gap-1.5 self-end sm:self-center flex-shrink-0 pt-2 sm:pt-0 border-t sm:border-0 border-gray-100 w-full sm:w-auto justify-end">';
        html += '    <button onclick="openRundownModal(\'' + rd.id + '\')" class="px-2.5 py-1 bg-indigo-50 text-[#5A56EC] hover:bg-indigo-100 rounded-lg text-[11px] font-bold transition">Edit</button>';
        html += '    <button onclick="deleteRundownProcess(\'' + rd.id + '\')" class="px-2.5 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[11px] font-bold transition">Hapus</button>';
        html += '  </div>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderKontakList() {
    var container = document.getElementById('kontak-items-container');
    if (!container) return;

    var list = appState.kontakList || [];
    if (!list || list.length === 0) {
      container.innerHTML = '<div class="text-center py-4 text-xs text-gray-400">Belum ada kontak panitia terdaftar.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var kt = list[i];
      var waClean = (kt.noWhatsapp || '').replace(/\D/g, '');
      if (waClean.startsWith('0')) waClean = '62' + waClean.substring(1);
      var waUrl = "https://wa.me/" + waClean;

      html += '<div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-xs">';
      html += '  <div>';
      html += '    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">' + escapeHtml(kt.jabatan) + '</p>';
      html += '    <a href="' + waUrl + '" target="_blank" class="font-bold text-[#5A56EC] hover:underline text-xs flex items-center gap-1 mt-0.5">';
      html += '      <span>' + escapeHtml(kt.nama) + ' (' + escapeHtml(kt.noWhatsapp) + ')</span>';
      html += '    </a>';
      html += '  </div>';

      if (appState.adminRole) {
        html += '  <div class="flex items-center gap-1.5">';
        html += '    <button onclick="openKontakModal(\'' + kt.id + '\')" class="px-2 py-1 bg-indigo-50 text-[#5A56EC] hover:bg-indigo-100 rounded-lg text-[11px] font-bold transition">Edit</button>';
        html += '    <button onclick="deleteKontakProcess(\'' + kt.id + '\')" class="px-2 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[11px] font-bold transition">Hapus</button>';
        html += '  </div>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  function openRundownModal(id) {
    var titleEl = document.getElementById('modal-rundown-title');
    document.getElementById('rd-input-id').value = id || '';

    if (id) {
      titleEl.textContent = 'Edit Agenda Rundown';
      var item = (appState.rundownList || []).find(function(x) { return x.id === id; });
      if (item) {
        document.getElementById('rd-input-hari').value = item.hari || appState.currentInfoHari;
        document.getElementById('rd-input-jam').value = item.jam || '';
        document.getElementById('rd-input-judul').value = item.judul || '';
        document.getElementById('rd-input-keterangan').value = item.keterangan || '';
      }
    } else {
      titleEl.textContent = 'Tambah Agenda Rundown';
      document.getElementById('rd-input-hari').value = appState.currentInfoHari || 'Hari 1';
      document.getElementById('rd-input-jam').value = '';
      document.getElementById('rd-input-judul').value = '';
      document.getElementById('rd-input-keterangan').value = '';
    }

    openModal('modal-rundown-crud');
  }

  function saveRundownProcess() {
    var btn = document.getElementById('btn-save-rd');
    btn.disabled = true;

    var payload = {
      id: document.getElementById('rd-input-id').value,
      hari: document.getElementById('rd-input-hari').value,
      jam: document.getElementById('rd-input-jam').value,
      judul: document.getElementById('rd-input-judul').value,
      keterangan: document.getElementById('rd-input-keterangan').value
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          if (res && res.success) {
            closeModal('modal-rundown-crud');
            showToast(res.message, 'success');
            loadDataFromBackend();
          } else {
            showToast(res ? res.message : 'Gagal menyimpan agenda', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          showToast('Error: ' + err.message, 'error');
        })
        .saveRundownItem(payload, appState.adminRole);
    } else {
      btn.disabled = false;
      closeModal('modal-rundown-crud');
      if (!payload.id) {
        payload.id = 'RD-00' + (appState.rundownList.length + 1);
        appState.rundownList.push(payload);
      } else {
        for (var i = 0; i < appState.rundownList.length; i++) {
          if (appState.rundownList[i].id === payload.id) {
            appState.rundownList[i] = payload;
            break;
          }
        }
      }

  function renderBusSeats() {
    var rowsContainer = document.getElementById('bus-rows-container');
    var row8Container = document.getElementById('bus-row-8-container');
    
    var allSeats = appState.seats || [];
    var seats = allSeats.filter(function(x) { return x.idBus === appState.currentBusId; });

    var rowsMap = {};
    for (var s = 0; s < seats.length; s++) {
      var item = seats[s];
      if (!rowsMap[item.baris]) rowsMap[item.baris] = [];
      rowsMap[item.baris].push(item);
    }

    var rowsHtml = '';
    for (var r = 1; r <= 7; r++) {
      var currentSeats = rowsMap[r] || [];
      
      var seat1 = currentSeats[0] || { idBus: appState.currentBusId, noKursi: ('0' + ((r-1)*4+1)).slice(-2) };
      var seat2 = currentSeats[1] || { idBus: appState.currentBusId, noKursi: ('0' + ((r-1)*4+2)).slice(-2) };
      var seat3 = currentSeats[2] || { idBus: appState.currentBusId, noKursi: ('0' + ((r-1)*4+3)).slice(-2) };
      var seat4 = currentSeats[3] || { idBus: appState.currentBusId, noKursi: ('0' + ((r-1)*4+4)).slice(-2) };

      rowsHtml += '<div class="flex items-center gap-2 md:gap-3">';
      rowsHtml += '  <div class="grid grid-cols-2 gap-1.5 md:gap-2 w-5/12">';
      rowsHtml += renderSingleSeatCard(seat1);
      rowsHtml += renderSingleSeatCard(seat2);
      rowsHtml += '  </div>';
      rowsHtml += '  <div class="w-2/12 text-center text-[10px] md:text-xs font-extrabold text-gray-400 tracking-wider">Baris ' + r + '</div>';
      rowsHtml += '  <div class="grid grid-cols-2 gap-1.5 md:gap-2 w-5/12">';
      rowsHtml += renderSingleSeatCard(seat3);
      rowsHtml += renderSingleSeatCard(seat4);
      rowsHtml += '  </div>';
      rowsHtml += '</div>';
    }
    rowsContainer.innerHTML = rowsHtml;

    var row8Seats = rowsMap[8] || [];
    var row8Html = '';
    for (var b = 0; b < row8Seats.length; b++) {
      row8Html += renderSingleSeatCard(row8Seats[b]);
    }
    row8Container.innerHTML = row8Html;
  }

  function renderSingleSeatCard(seat) {
    var isOccupied = (seat.namaTerisi && seat.namaTerisi.trim() !== '');
    var isSelected = (appState.selectedSeatForSwap && appState.selectedSeatForSwap.busId === seat.idBus && appState.selectedSeatForSwap.seatNo === seat.noKursi);
    
    var bgClass = isOccupied ? 'bg-[#265768] text-white shadow-sm' : 'bg-white border-2 border-dashed border-gray-200 text-gray-400';
    var selectClass = isSelected ? 'seat-selected-swap' : '';
    var cursorClass = 'cursor-pointer hover:border-[#EA6A9C]';
    var displayName = isOccupied ? escapeHtml(seat.namaTerisi) : 'Kosong';

    var formattedSeatNo = ('0' + seat.noKursi).slice(-2);

    var out = '';
    out += '<div onclick="handleSeatClick(\'' + seat.idBus + '\', \'' + seat.noKursi + '\', \'' + escapeHtml(seat.namaTerisi || '') + '\')" class="card-seat p-1.5 text-center flex flex-col justify-between min-h-[64px] md:min-h-[68px] ' + bgClass + ' ' + selectClass + ' ' + cursorClass + '">';
    out += '  <div class="flex items-center justify-between mb-0.5 pointer-events-none">';
    out += '    <span class="text-[10px] md:text-xs font-black uppercase tracking-wider ' + (isOccupied ? 'text-pink-300' : 'text-gray-400') + '">' + formattedSeatNo + '</span>';
    if (isOccupied) {
      out += '    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>';
    }
    out += '  </div>';
    out += '  <div class="text-[10px] md:text-xs font-bold leading-tight break-words line-clamp-2 my-auto pointer-events-none">' + displayName + '</div>';
    out += '</div>';
    return out;
  }

  function handleSeatClick(busId, seatNo, namaTerisi) {
    var formattedNo = ('0' + seatNo).slice(-2);
    if (!appState.adminRole) {
      if (namaTerisi && namaTerisi.trim() !== '') {
        showToast('🚍 Kursi ' + busId + ' (' + formattedNo + '): ' + namaTerisi, 'info');
      } else {
        showToast('🚍 Kursi ' + busId + ' (' + formattedNo + ') masih KOSONG.', 'info');
      }
      return;
    }

    if (!appState.selectedSeatForSwap) {
      appState.selectedSeatForSwap = { busId: busId, seatNo: seatNo };
      showToast('Kursi (' + busId + ' - ' + formattedNo + ') dipilih. Klik kursi lain untuk swap.', 'info');
      renderBusSeats();
    } else {
      if (appState.selectedSeatForSwap.busId === busId && appState.selectedSeatForSwap.seatNo === seatNo) {
        appState.selectedSeatForSwap = null;
        showToast('Batal memilih kursi.', 'info');
        renderBusSeats();
        return;
      }

      var busA = appState.selectedSeatForSwap.busId;
      var seatA = appState.selectedSeatForSwap.seatNo;
      var busB = busId;
      var seatB = seatNo;
      appState.selectedSeatForSwap = null;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              showToast(res.message, 'success');
              loadDataFromBackend();
            } else {
              showToast(res ? res.message : 'Gagal menukar kursi', 'error');
              loadDataFromBackend();
            }
          })
          .withFailureHandler(function(err) {
            showToast('Error: ' + err.message, 'error');
            loadDataFromBackend();
          })
          .swapBusSeats(busA, seatA, busB, seatB);
      } else {
        showToast('Preview: Kursi (' + busA + ' - ' + seatA + ') & (' + busB + ' - ' + seatB + ') ditukar!', 'success');
      }
    }
  }

  function downloadBackupJsonFile_(jsonString, timestamp) {

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'BACKUP_HALAL_BIHALAL_RT_' + new Date().getTime() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

  function generateExcelDownload_(rows) {
    if (!rows || rows.length === 0) {
      showToast('Data ekspor kosong', 'error');
      return;
    }

    var headers = [
      'No', 
      'Keluarga', 
      'No. WhatsApp', 
      'Nama Peserta', 
      'Status Keluarga', 
      'ID Transaksi', 
      'Tanggal', 
      'No. Rumah', 
      'Catatan Lokasi', 
      'Pembayaran', 
      'Total Tabungan (Rp)', 
      'Bus', 
      'Kursi'
    ];

    var aoa = [headers];
    var merges = [];
    var rowStyles = [null];

    var familyGroupIndex = 0;
    var i = 0;

    while (i < rows.length) {
      var r = rows[i];
      var famCount = r.familyCount || 1;
      var startRow = aoa.length;

      var bgRgb = (familyGroupIndex % 2 === 0) ? 'F2F4F8' : 'FFFFFF';

      for (var f = 0; f < famCount && (i + f) < rows.length; f++) {
        var curr = rows[i + f];
        var tabVal = parseInt(curr.jumlahTabungan || 0, 10);
        var formattedTab = 'Rp ' + tabVal.toLocaleString('id-ID');
        var formattedSeatNo = ('0' + curr.noKursi).slice(-2);

        aoa.push([
          (i + f + 1),
          curr.keluarga || curr.namaPeserta,
          curr.noWhatsapp || '-',
          curr.namaPeserta,
          curr.statusKeluarga || 'Kepala Keluarga',
          curr.idTransaksi || '-',
          curr.tanggal || '-',
          curr.noRumah || '-',
          curr.catatanLokasi || '-',
          curr.metodePembayaran || 'Tunai',
          formattedTab,
          curr.idBus || '-',
          formattedSeatNo || '-'
        ]);

        rowStyles.push(bgRgb);
      }

      if (famCount > 1) {
        var endRow = startRow + famCount - 1;
        merges.push({ s: { r: startRow, c: 1 }, e: { r: endRow, c: 1 } });
        merges.push({ s: { r: startRow, c: 2 }, e: { r: endRow, c: 2 } });
      }

      familyGroupIndex++;
      i += famCount;
    }

    if (typeof XLSX !== 'undefined') {
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.aoa_to_sheet(aoa);

      if (merges.length > 0) {
        ws['!merges'] = merges;
      }

      var range = XLSX.utils.decode_range(ws['!ref']);
      for (var R = range.s.r; R <= range.e.r; ++R) {
        var isHeader = (R === 0);
        var rowBg = rowStyles[R] || 'FFFFFF';

        for (var C = range.s.c; C <= range.e.c; ++C) {
          var cellRef = XLSX.utils.encode_cell({ r: R, c: C });
          if (!ws[cellRef]) continue;

          if (isHeader) {
            ws[cellRef].s = {
              fill: { fgColor: { rgb: 'EA6A9C' } },
              font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 10 },
              alignment: { horizontal: 'center', vertical: 'center' },
              border: {
                top: { style: 'thin', color: { rgb: 'CCCCCC' } },
                bottom: { style: 'medium', color: { rgb: 'EA6A9C' } },
                left: { style: 'thin', color: { rgb: 'CCCCCC' } },
                right: { style: 'thin', color: { rgb: 'CCCCCC' } }
              }
            };
          } else {
            ws[cellRef].s = {
              fill: { fgColor: { rgb: rowBg } },
              font: { sz: 9.5 },
              alignment: { 
                vertical: 'center', 
                horizontal: (C === 0 || C === 5 || C === 6 || C === 11 || C === 12) ? 'center' : (C === 10 ? 'right' : 'left')
              },
              border: {
                top: { style: 'thin', color: { rgb: 'E2E8F0' } },
                bottom: { style: 'thin', color: { rgb: 'E2E8F0' } },
                left: { style: 'thin', color: { rgb: 'E2E8F0' } },
                right: { style: 'thin', color: { rgb: 'E2E8F0' } }
              }
            };
          }
        }
      }

      ws['!cols'] = [
        { wch: 5 },
        { wch: 22 },
        { wch: 16 },
        { wch: 22 },
        { wch: 18 },
        { wch: 12 },
        { wch: 20 },
        { wch: 12 },
        { wch: 25 },
        { wch: 12 },
        { wch: 18 },
        { wch: 10 },
        { wch: 10 }
      ];

      XLSX.utils.book_append_sheet(wb, ws, 'Rekap Tabungan Keluarga');
      
      var timestamp = new Date().getTime();
      var fileName = 'REKAP_TABUNGAN_KELUARGA_' + timestamp + '.xlsx';
      XLSX.writeFile(wb, fileName);
      showToast('File Excel (.xlsx) belang per keluarga berhasil diunduh!', 'success');
    } else {
      showToast('Library SheetJS belum terhubung', 'error');
    }
  }

  function renderAndTriggerPrint_(rows, timestamp) {
    document.getElementById('print-timestamp').textContent = 'Dicetak pada: ' + (timestamp || new Date().toLocaleString('id-ID'));
    var tbody = document.getElementById('print-table-body');
    var tfoot = document.getElementById('print-table-foot');
    var html = '';

    var i = 0;
    var familyGroupIndex = 0;
    var globalIndex = 1;
    var grandTotalTabungan = 0;

    while (i < rows.length) {
      var head = rows[i];
      var famCount = head.familyCount || 1;
      var isEvenGroup = (familyGroupIndex % 2 === 0);
      var bgClass = isEvenGroup ? 'bg-gray-100' : 'bg-white';

      var totalFamilyTab = 0;
      for (var fCount = 0; fCount < famCount && (i + fCount) < rows.length; fCount++) {
        totalFamilyTab += parseInt(rows[i + fCount].jumlahTabungan || 0, 10);
      }
      grandTotalTabungan += totalFamilyTab;

      for (var f = 0; f < famCount && (i + f) < rows.length; f++) {
        var curr = rows[i + f];
        var isFirstRowInFamily = (f === 0);
        var isLastRowInFamily = (f === famCount - 1);

        var borderBottomStyle = isLastRowInFamily ? 'border-b-2 border-black' : 'border-b border-gray-400';
        var formattedSeatNo = ('0' + (curr.noKursi || '-')).slice(-2);

        html += '<tr class="' + bgClass + ' text-center">';
        html += '  <td class="border-x border-t border-gray-400 ' + borderBottomStyle + ' p-1.5">' + globalIndex + '</td>';
        html += '  <td class="border-x border-t border-gray-400 ' + borderBottomStyle + ' p-1.5 font-mono text-[11px]">' + escapeHtml(curr.idTransaksi) + '</td>';
        
        var displayName = escapeHtml(curr.namaPeserta);
        if (!curr.isHead && curr.statusKeluarga) {
          displayName += ' <span class="text-gray-500 font-normal">(' + escapeHtml(curr.statusKeluarga) + ')</span>';
        }
        html += '  <td class="border-x border-t border-gray-400 ' + borderBottomStyle + ' p-1.5 font-bold text-left">' + displayName + '</td>';

        if (isFirstRowInFamily) {
          var rowspanAttr = famCount > 1 ? ' rowspan="' + famCount + '"' : '';
          var mergedBorderClass = 'border-x border-t border-gray-400 border-b-2 border-black';

          html += '  <td' + rowspanAttr + ' class="' + mergedBorderClass + ' p-1.5 align-middle">' + escapeHtml(head.noWhatsapp || '-') + '</td>';
          html += '  <td' + rowspanAttr + ' class="' + mergedBorderClass + ' p-1.5 align-middle">' + escapeHtml(head.noRumah || '-') + '</td>';
          html += '  <td' + rowspanAttr + ' class="' + mergedBorderClass + ' p-1.5 align-middle font-bold">' + escapeHtml(head.keluarga || head.namaPeserta) + '</td>';
          html += '  <td' + rowspanAttr + ' class="' + mergedBorderClass + ' p-1.5 align-middle font-bold text-emerald-700">Rp ' + totalFamilyTab.toLocaleString('id-ID') + '</td>';
        }

        html += '  <td class="border-x border-t border-gray-400 ' + borderBottomStyle + ' p-1.5 font-bold">' + escapeHtml(curr.idBus || '-') + '</td>';
        html += '  <td class="border-x border-t border-gray-400 ' + borderBottomStyle + ' p-1.5 font-bold text-indigo-600">' + formattedSeatNo + '</td>';
        html += '</tr>';
        globalIndex++;
      }

      familyGroupIndex++;
      i += famCount;
    }

    tbody.innerHTML = html;

    var totalPeserta = rows.length;
    var footHtml = '';
    footHtml += '<tr class="bg-gray-200 font-bold text-center border-t-2 border-black text-xs">';
    footHtml += '  <td colspan="3" class="border border-black p-2 text-left uppercase tracking-wider">TOTAL MANIFEST BUS MEDIUM:</td>';

    footHtml += '  <td colspan="2" class="border border-black p-2 text-center text-gray-600">-</td>';
    footHtml += '</tr>';

    if (tfoot) {
      tfoot.innerHTML = footHtml;
    }

    var printArea = document.getElementById('print-manifest-area');

    setTimeout(function() {

    document.getElementById('print-bus-title').textContent = 'DENAH KURSI PENUMPANG BUS MEDIUM - ' + currentBus.toUpperCase();
    document.getElementById('print-bus-timestamp').textContent = 'Dicetak pada: ' + new Date().toLocaleString('id-ID');

    var container = document.getElementById('print-bus-grid');
    var rowsMap = {};
    var occupiedCount = 0;
    for (var s = 0; s < seats.length; s++) {
      var item = seats[s];
      if (item.namaTerisi && item.namaTerisi.trim() !== '') occupiedCount++;
      if (!rowsMap[item.baris]) rowsMap[item.baris] = [];
      rowsMap[item.baris].push(item);
    }

    var html = '';

    html += '<div class="flex justify-between items-center border-2 border-black p-3 mb-5 bg-gray-100 font-bold text-sm uppercase tracking-wider rounded-xl">';
    html += '  <div class="flex items-center gap-2"><span class="px-2.5 py-1 bg-black text-white rounded text-xs">KN</span> PINTU / KERNET</div>';
    html += '  <div class="text-center font-extrabold text-xs text-gray-800">STATUS: TERISI ' + occupiedCount + ' / 33 KURSI</div>';
    html += '  <div class="flex items-center gap-2">SOPIR BUS <span class="px-2.5 py-1 bg-black text-white rounded text-xs">SP</span></div>';
    html += '</div>';

    html += '<div class="space-y-3.5">';
    for (var r = 1; r <= 7; r++) {
      var currentSeats = rowsMap[r] || [];
      var seat1 = currentSeats[0] || { noKursi: ('0' + ((r-1)*4+1)).slice(-2) };
      var seat2 = currentSeats[1] || { noKursi: ('0' + ((r-1)*4+2)).slice(-2) };
      var seat3 = currentSeats[2] || { noKursi: ('0' + ((r-1)*4+3)).slice(-2) };
      var seat4 = currentSeats[3] || { noKursi: ('0' + ((r-1)*4+4)).slice(-2) };

      html += '<div class="flex items-center gap-3 text-center text-xs">';
      html += '  <div class="grid grid-cols-2 gap-2.5 w-5/12">';
      html += renderPrintSeatBox(seat1);
      html += renderPrintSeatBox(seat2);
      html += '  </div>';
      html += '  <div class="w-2/12 font-extrabold text-gray-800 text-xs uppercase tracking-wider">BARIS ' + r + '</div>';
      html += '  <div class="grid grid-cols-2 gap-2.5 w-5/12">';
      html += renderPrintSeatBox(seat3);
      html += renderPrintSeatBox(seat4);
      html += '  </div>';
      html += '</div>';
    }

    var row8Seats = rowsMap[8] || [];
    html += '<div class="mt-6 pt-4 border-t-2 border-black">';
    html += '  <p class="text-xs font-black uppercase text-center mb-2.5 tracking-wider">BARIS 8 (BELAKANG PENUH • 5 KURSI)</p>';
    html += '  <div class="grid grid-cols-5 gap-2.5 text-center text-xs">';
    for (var b = 0; b < row8Seats.length; b++) {
      html += renderPrintSeatBox(row8Seats[b]);
    }
    html += '  </div>';
    html += '</div>';

    html += '</div>';

    container.innerHTML = html;

    var busPrintArea = document.getElementById('print-bus-area');
    busPrintArea.classList.remove('hidden');

    setTimeout(function() {
      window.print();
      busPrintArea.classList.add('hidden');
    }, 150);
  }

  function renderPrintSeatBox(seat) {
    var isOccupied = (seat.namaTerisi && seat.namaTerisi.trim() !== '');
    var name = isOccupied ? escapeHtml(seat.namaTerisi) : 'KOSONG';
    var bg = isOccupied ? 'bg-gray-100 font-bold' : 'bg-white text-gray-400';
    var formattedSeatNo = ('0' + seat.noKursi).slice(-2);

    return '<div class="border-2 border-black p-2.5 rounded-xl min-h-[68px] flex flex-col justify-between ' + bg + '">' +
           '  <div class="font-black text-sm underline tracking-wider text-black">' + formattedSeatNo + '</div>' +
           '  <div class="text-xs break-words line-clamp-2 leading-tight mt-1 font-bold">' + name + '</div>' +
           '</div>';
  }

  function openAddFamilyModal(sponsorId, sponsorNama) {
    document.getElementById('fam-sponsor-id').value = sponsorId;
    document.getElementById('fam-sponsor-name').value = sponsorNama;
    document.getElementById('fam-member-name').value = '';
    document.getElementById('fam-pin-akses').value = '';
    document.getElementById('fam-setoran-awal').value = '';
    openModal('modal-family');
  }

  function submitFamilyMember() {
    var btn = document.getElementById('btn-submit-fam');
    btn.disabled = true;

    var payload = {
      sponsorId: document.getElementById('fam-sponsor-id').value,
      sponsorNama: document.getElementById('fam-sponsor-name').value,
      pinAkses: document.getElementById('fam-pin-akses').value,
      namaAnggota: document.getElementById('fam-member-name').value,
      hubungan: document.getElementById('fam-relation').value,
      setoranAwal: document.getElementById('fam-setoran-awal').value || 0
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          if (res && res.success) {
            closeModal('modal-family');
            showToast('Anggota keluarga berhasil didaftarkan!', 'success');
            loadDataFromBackend();
          } else {
            showToast(res ? res.message : 'PIN Akses Salah!', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          showToast('Error: ' + err.message, 'error');
        })
        .addFamilyMember(payload);
    } else {
      btn.disabled = false;
      closeModal('modal-family');
      showToast('Preview: Anggota keluarga ditambahkan', 'success');
    }
  }

  function submitAdminLogin() {
    var pin = document.getElementById('admin-pin-input').value;
    var btn = document.getElementById('btn-submit-login');
    btn.disabled = true;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          if (res && res.success) {
            appState.adminRole = res.role;
            onAdminLoginSuccess();
            closeModal('modal-login');
            showToast('Login berhasil sebagai ' + res.role, 'success');
          } else {
            showToast(res ? res.message : 'PIN salah', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          showToast('Error: ' + err.message, 'error');
        })
        .adminLogin(pin);
    } else {
      btn.disabled = false;
      if (pin === '1234' || pin === '9999') {
        appState.adminRole = (pin === '9999') ? 'Super Admin' : 'Admin';
        onAdminLoginSuccess();
        closeModal('modal-login');
        showToast('Login preview berhasil sebagai ' + appState.adminRole, 'success');
      } else {
        showToast('PIN salah (Gunakan 1234 atau 9999)', 'error');
      }
    }
  }

  function deleteParticipantProcess(idTransaksi) {
    showToast('Menghapus data peserta...', 'info');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showToast('Peserta berhasil dihapus.', 'success');
            loadDataFromBackend();
          } else {
            showToast(res ? res.message : 'Gagal menghapus', 'error');
          }
        })
        .deleteParticipant(idTransaksi);
    } else {
      showToast('Preview: Peserta dihapus.', 'success');
    }
  }

  var searchTimer = null;
  function handleSearchInput() {
    var val = document.getElementById('search-input').value;
    var btnClear = document.getElementById('btn-clear-search');
    if (btnClear) {
      if (val && val.trim().length > 0) {
        btnClear.classList.remove('hidden');
      } else {
        btnClear.classList.add('hidden');
      }
    }
    debounceSearch();
  }

  function clearSearchInput() {
    var input = document.getElementById('search-input');
    var btnClear = document.getElementById('btn-clear-search');
    if (input) input.value = '';
    if (btnClear) btnClear.classList.add('hidden');
    appState.searchQuery = '';
    loadDataFromBackend();
  }

  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      appState.searchQuery = document.getElementById('search-input').value;
      loadDataFromBackend();
    }, 350);
  }

  function setFilterStatus(status) {
    appState.currentFilter = status;
    var btns = document.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-status') === status) {
        btns[i].className = 'filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#1E2238] text-[#FFFFFF]';
      } else {
        btns[i].className = 'filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-white text-gray-600 border border-gray-200';
      }
    }
    loadDataFromBackend();
  }

  function openModal(id) {
    var target = document.getElementById(id);
    if (target) {
      target.classList.remove('hidden');
    }
  }

  function closeModal(id) {
    var target = document.getElementById(id);
    if (target) {
      target.classList.add('hidden');
    }
  }

  function closeModalOnBackdrop(event, modalId) {
    if (event.target.id === modalId) {
      closeModal(modalId);
    }
  }

  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    var bg = (type === 'success') ? 'bg-emerald-600 text-white' : (type === 'error') ? 'bg-rose-600 text-white' : 'bg-gray-800 text-white';
    
    toast.className = 'toast-item ' + bg + ' px-4 py-3 shadow-xl flex items-center gap-2.5 text-xs font-bold mb-2.5';
    toast.innerHTML = '<span>' + escapeHtml(message) + '</span>';
    
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
